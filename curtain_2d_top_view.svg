<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 10" width="140" height="10">
  <!-- 2D Top View of Curtain: 1.4m wide x 0.01m deep -->
  <!-- Scale: 1 unit = 0.01m (1cm) -->

  <!-- Curtain rail/rod -->
  <rect x="0" y="2" width="140" height="2" fill="#888888" stroke="#555555" stroke-width="0.5"/>

  <!-- Curtain fabric folds - seen from above as zigzag -->
  <polyline points="0,5 5,3 10,7 15,3 20,7 25,3 30,7 35,3 40,7 45,3 50,7 55,3 60,7 65,3 70,7 75,3 80,7 85,3 90,7 95,3 100,7 105,3 110,7 115,3 120,7 125,3 130,7 135,3 140,5"
    fill="none" stroke="#444444" stroke-width="1"/>
</svg>
