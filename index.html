<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Yatzee">
<meta name="theme-color" id="tcolor" content="#f7f4ee">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230d1117'/%3E%3Cg fill='%23f5c518'%3E%3Ccircle cx='60' cy='60' r='14'/%3E%3Ccircle cx='120' cy='60' r='14'/%3E%3Ccircle cx='90' cy='90' r='14'/%3E%3Ccircle cx='60' cy='120' r='14'/%3E%3Ccircle cx='120' cy='120' r='14'/%3E%3C/g%3E%3C/svg%3E">
<title>Yatzee Scores</title>
<style>
  /* Licht is de basis; donker wordt hieronder per token overschreven.
     Drie standen: systeem (geen data-theme), of handmatig vastgezet. */
  :root{
    color-scheme:light;
    --bg:#f7f4ee; --panel:#fffdf9; --line:#ddd4c4; --line-soft:#ebe4d8;
    --txt:#1f1c17; --dim:#7a7266; --acc:#9a6f00; --good:#1a7f37; --bad:#c02b1d;
    --btn:#efe9dd; --btn-a:#e3dacb; --on-acc:#fffdf9; --empty:#c0b8a8;
    --cell-a:#f0eadd; --calc:#f2ece1; --sep:#e8e0d2; --input:#fffdf9;
    --scrim:rgba(58,48,28,.38);
    --cell:56px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#0d1117; --panel:#161b22; --line:#2a323d; --line-soft:#212934;
      --txt:#e6edf3; --dim:#8b949e; --acc:#f5c518; --good:#3fb950; --bad:#f85149;
      --btn:#21262d; --btn-a:#2d333b; --on-acc:#111; --empty:#3d444d;
      --cell-a:#1c2430; --calc:#131a22; --sep:#0a0e14; --input:#0b1017;
      --scrim:rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0d1117; --panel:#161b22; --line:#2a323d; --line-soft:#212934;
    --txt:#e6edf3; --dim:#8b949e; --acc:#f5c518; --good:#3fb950; --bad:#f85149;
    --btn:#21262d; --btn-a:#2d333b; --on-acc:#111; --empty:#3d444d;
    --cell-a:#1c2430; --calc:#131a22; --sep:#0a0e14; --input:#0b1017;
    --scrim:rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--txt);
    font:16px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    -webkit-user-select:none; user-select:none;
    overscroll-behavior:none;
    display:flex; flex-direction:column; height:100vh; height:100dvh;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  :focus-visible{outline:2px solid var(--acc); outline-offset:2px}

  header{
    flex:none; display:flex; align-items:center; gap:10px;
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
    border-bottom:1px solid var(--line); background:var(--panel);
  }
  header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.3px;flex:1;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .btn{
    padding:8px 12px; border-radius:9px; background:var(--btn);
    border:1px solid var(--line); font-size:14px; font-weight:600;
  }
  .btn:active{background:var(--btn-a)}
  .btn-icon{padding:8px 10px; font-size:15px; line-height:1.2}
  .btn-acc{background:var(--acc); color:var(--on-acc); border-color:var(--acc)}
  .hide{display:none !important}

  /* ---------- views + tabbalk ---------- */
  .view{flex:1; overflow:auto; -webkit-overflow-scrolling:touch; display:none}
  .view.on{display:block}
  nav.tabs{
    flex:none; display:flex; border-top:1px solid var(--line); background:var(--panel);
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav.tabs button{
    flex:1; padding:12px 4px; font-size:13px; font-weight:600; color:var(--dim);
    border-top:2px solid transparent; margin-top:-1px;
  }
  nav.tabs button.on{color:var(--acc); border-top-color:var(--acc)}

  /* ---------- scorekaart ---------- */
  #vGame{padding-bottom:20px}
  table{border-collapse:separate; border-spacing:0; width:max-content; min-width:100%}
  th,td{border-bottom:1px solid var(--line-soft); text-align:center; height:var(--cell)}
  thead th{
    position:sticky; top:0; z-index:3; background:var(--panel);
    border-bottom:1px solid var(--line); font-size:13px; padding:6px 4px;
  }
  .cat{
    position:sticky; left:0; z-index:2; background:var(--bg);
    text-align:left; padding:0 10px; min-width:150px; font-size:14px;
    border-right:1px solid var(--line);
  }
  thead .cat{z-index:4; background:var(--panel)}
  .cat small{display:block; color:var(--dim); font-size:11px; font-weight:400}
  td.score{min-width:72px; font-size:19px; font-weight:600; font-variant-numeric:tabular-nums}
  td.score.empty{color:var(--empty)}
  td.score.zero{color:var(--bad)}
  td.score.void{color:var(--dim); text-decoration:line-through}
  td.score.yb{color:var(--good)}
  td.score:active{background:var(--cell-a)}
  tr.calc td, tr.calc .cat{background:var(--calc); font-weight:700}
  tr.calc td{color:var(--dim); font-size:16px}
  tr.bonus td.hit{color:var(--good)}
  tr.bonus td.need{color:var(--txt); font-size:13.5px; font-weight:600}
  tr.bonus td.miss{color:var(--dim); font-size:13px; font-weight:600}
  tr.total td{color:var(--acc); font-size:22px}
  tr.total .cat{font-size:15px}
  tr.sep td, tr.sep th{height:8px; border:0; background:var(--sep)}
  .pname{display:block; font-weight:700; max-width:90px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin:0 auto}
  .plead{color:var(--acc)}
  .ptot{display:block; color:var(--dim); font-size:12px; font-weight:600}

  .banner{
    display:flex; align-items:center; gap:10px; padding:10px 14px;
    background:var(--calc); border-bottom:1px solid var(--line); font-size:14px;
  }
  .banner span{flex:1}
  .banner .btn{white-space:nowrap}

  /* ---------- statistieken ---------- */
  .stats{padding:14px 14px 24px; display:flex; flex-direction:column; gap:18px}
  .stats h2{font-size:13px; letter-spacing:.6px; text-transform:uppercase;
    color:var(--dim); margin:0 0 8px; font-weight:700}
  .stack{display:flex; flex-direction:column; gap:8px}
  .empty-note{color:var(--dim); font-size:14px; line-height:1.5}

  .pcard{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 14px}
  .pc-top{display:flex; align-items:baseline; gap:8px}
  .pc-name{font-weight:700; font-size:16px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .pc-avg{font-size:20px; font-weight:700; color:var(--acc); font-variant-numeric:tabular-nums}
  .pc-avg small{font-size:11px; color:var(--dim); font-weight:600; margin-left:3px}
  .pc-sub{color:var(--dim); font-size:12.5px; margin-top:3px; font-variant-numeric:tabular-nums}
  .pc-spark{display:flex; align-items:center; gap:8px; margin-top:8px}
  .pc-spark svg{display:block; max-width:100%}
  .pc-last{font-size:12px; color:var(--dim); font-variant-numeric:tabular-nums}

  .rec{display:flex; gap:10px; align-items:baseline; padding:9px 0; border-bottom:1px solid var(--line-soft)}
  .rec:last-child{border-bottom:0}
  .rec b{font-size:16px; font-variant-numeric:tabular-nums; min-width:52px}
  .rec-lb{flex:1; font-size:13px}
  .rec-lb small{display:block; color:var(--dim); font-size:11.5px}

  .hrow{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line-soft)}
  .hrow:last-child{border-bottom:0}
  .hrow .h-main{flex:1; min-width:0}
  .hrow .h-date{color:var(--dim); font-size:11.5px}
  .hrow .h-players{font-size:13.5px; margin-top:2px; font-variant-numeric:tabular-nums}
  .hrow .h-win{color:var(--acc); font-weight:700}
  .hrow .h-del{padding:8px 6px; color:var(--dim); font-size:16px; line-height:1}

  /* ---------- sheets ---------- */
  .sheet{
    position:fixed; inset:0; z-index:20; display:none;
    background:var(--scrim); backdrop-filter:blur(2px);
  }
  .sheet.on{display:block}
  .sheet-in{
    position:absolute; left:0; right:0; bottom:0; background:var(--panel);
    border-top:1px solid var(--line); border-radius:18px 18px 0 0;
    padding:14px 14px calc(18px + env(safe-area-inset-bottom));
    animation:up .18s ease-out;
    /* Lange keuzelijsten scrollen binnen de kaart; knoppen blijven bereikbaar. */
    max-height:88vh; display:flex; flex-direction:column;
  }
  @media (prefers-reduced-motion:reduce){ .sheet-in{animation:none} }
  @keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .sheet h2{margin:0 0 2px; font-size:18px}
  .sheet p{margin:0 0 12px; color:var(--dim); font-size:13px}
  .opts{display:grid; grid-template-columns:repeat(auto-fill,minmax(72px,1fr)); gap:8px;
    overflow-y:auto; -webkit-overflow-scrolling:touch; align-content:start}
  .opt{
    padding:14px 4px; border-radius:12px; background:var(--btn); border:1px solid var(--line);
    font-size:19px; font-weight:700; font-variant-numeric:tabular-nums;
  }
  .opt:active{background:var(--acc); color:var(--on-acc)}
  .opt.zero{color:var(--bad)}
  .sheet-foot{display:flex; gap:8px; margin-top:14px}
  .sheet-foot .btn{flex:1; text-align:center; padding:13px}
  .sheet-stack{display:flex; flex-direction:column; gap:8px; overflow-y:auto}
  .sheet-stack .btn{width:100%; text-align:center; padding:14px}

  /* ---------- spelers + back-up ---------- */
  .setup{padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
  .setup h2{font-size:16px; margin:0 0 12px}
  .prow{display:flex; gap:8px; align-items:center; margin-bottom:8px}
  .prow input{
    flex:1; padding:13px 12px; border-radius:11px; background:var(--input);
    border:1px solid var(--line); color:var(--txt); font-size:16px;
    -webkit-user-select:text; user-select:text;
  }
  .prow input:focus{outline:none; border-color:var(--acc)}
  .prow .del{padding:12px 14px; color:var(--bad); font-size:20px; line-height:1}
  .setup .btn{width:100%; text-align:center; padding:14px; margin-top:8px}
  .roster-head{display:flex; align-items:baseline; gap:8px; margin-top:16px}
  .roster-head h3{flex:1; margin:0; font-size:12px; font-weight:700;
    text-transform:uppercase; letter-spacing:.6px; color:var(--dim)}
  .link{font-size:13px; font-weight:600; color:var(--acc); padding:4px 0}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px}
  .chip{padding:9px 13px; border-radius:999px; background:var(--btn);
    border:1px solid var(--line); font-size:14px; font-weight:600}
  .chip:active{background:var(--acc); color:var(--on-acc)}
  .chips.editing .chip{color:var(--bad); border-color:var(--bad)}
  .chips.editing .chip::after{content:' ✕'}
  #bkText{
    width:100%; height:120px; padding:10px; border-radius:11px; background:var(--input);
    border:1px solid var(--line); color:var(--txt); font-size:12px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    -webkit-user-select:text; user-select:text; resize:none;
  }
  #bkMsg{min-height:18px; font-size:12.5px; color:var(--dim); margin:8px 0 0}
</style>
</head>
<body>

<header>
  <h1>YATZEE</h1>
  <button class="btn btn-icon" id="btnTheme" aria-label="Thema"></button>
  <button class="btn" id="btnPlayers">Spelers</button>
  <button class="btn" id="btnNew">Nieuw</button>
  <button class="btn hide" id="btnBackup">Back-up</button>
</header>

<div class="view on" id="vGame">
  <div class="banner hide" id="banner">
    <span>Potje compleet.</span>
    <button class="btn btn-acc" id="btnFinish">Opslaan</button>
  </div>
  <table id="card"></table>
</div>

<div class="view" id="vStats"><div class="stats" id="statsBody"></div></div>

<nav class="tabs">
  <button class="on" data-view="vGame">Scorekaart</button>
  <button data-view="vStats">Statistieken</button>
</nav>

<div class="sheet" id="sheet">
  <div class="sheet-in">
    <h2 id="shTitle"></h2>
    <p id="shHint"></p>
    <div class="opts" id="shOpts"></div>
    <div class="sheet-foot">
      <button class="btn" id="shClear">Wissen</button>
      <button class="btn" id="shCancel">Annuleren</button>
    </div>
  </div>
</div>

<div class="sheet" id="csheet">
  <div class="sheet-in">
    <h2 id="cTitle"></h2>
    <p id="cText"></p>
    <div class="sheet-stack" id="cBtns"></div>
  </div>
</div>

<div class="sheet" id="psheet">
  <div class="sheet-in">
    <h2>Spelers</h2>
    <p>Namen aanpassen of spelers toevoegen. Minimaal 2, maximaal 8.</p>
    <div class="setup" style="padding:0; overflow-y:auto">
      <div id="plist"></div>
      <button class="btn" id="pAdd">+ Speler toevoegen</button>
      <div class="roster hide" id="roster">
        <div class="roster-head">
          <h3 id="rosterTitle">Eerder gespeeld</h3>
          <button class="link" id="rosterEdit">Bewerken</button>
        </div>
        <div class="chips" id="chips"></div>
      </div>
      <button class="btn btn-acc" id="pDone">Klaar</button>
    </div>
  </div>
</div>

<div class="sheet" id="bsheet">
  <div class="sheet-in">
    <h2>Back-up</h2>
    <p>Kopieer deze tekst en plak 'm op een ander toestel om je historie mee te nemen.</p>
    <textarea id="bkText" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>
    <p id="bkMsg"></p>
    <div class="sheet-foot">
      <button class="btn" id="bkCopy">Kopieer</button>
      <button class="btn" id="bkImport">Importeer</button>
      <button class="btn" id="bkClose">Sluiten</button>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  // --- categorieën -------------------------------------------------------
  // kind: 'face'  = bovenvak (aantal ogen x waarde)
  //       'sum'   = som van alle 5 dobbelstenen (5..30)
  //       'fixed' = vaste score of 0
  //       'yb'    = bonusrij, veelvoud van 100
  const CATS = [
    {id:'d1', name:'Enen',          hint:'1 punt per één',   kind:'face', face:1},
    {id:'d2', name:'Tweeën',        hint:'2 punten per twee',kind:'face', face:2},
    {id:'d3', name:'Drieën',        hint:'3 punten per drie',kind:'face', face:3},
    {id:'d4', name:'Vieren',        hint:'4 punten per vier',kind:'face', face:4},
    {id:'d5', name:'Vijven',        hint:'5 punten per vijf',kind:'face', face:5},
    {id:'d6', name:'Zessen',        hint:'6 punten per zes', kind:'face', face:6},
    {id:'tk', name:'Drie gelijk',   hint:'Som van alle 5 stenen', kind:'sum'},
    {id:'fk', name:'Vier gelijk',   hint:'Som van alle 5 stenen', kind:'sum'},
    {id:'fh', name:'Full house',    hint:'3 + 2 gelijk',     kind:'fixed', val:25},
    {id:'ss', name:'Kleine straat', hint:'4 op een rij',     kind:'fixed', val:30},
    {id:'ls', name:'Grote straat',  hint:'5 op een rij',     kind:'fixed', val:40},
    {id:'yz', name:'Yatzee',        hint:'5 gelijk',         kind:'fixed', val:50},
    {id:'yb', name:'Yatzee bonus',  hint:'+100 per extra Yatzee', kind:'yb', step:100, opt:true},
    {id:'ch', name:'Chance',        hint:'Som van alle 5 stenen', kind:'sum'}
  ];
  const UPPER = ['d1','d2','d3','d4','d5','d6'];
  const BONUS_AT = 63, BONUS = 35;
  const KEY = 'yatzee.v1', HKEY = 'yatzee.hist.v1', NKEY = 'yatzee.names.v1';
  const MIN_P = 2, MAX_P = 8, MAX_N = 24;

  // --- state -------------------------------------------------------------
  let S = load() || newGame(['Speler 1','Speler 2']);
  let H = loadHist();
  let N = loadNames();

  function newGame(names){ return {players: names.map(n => ({name:n, sc:{}}))}; }
  function load(){
    try {
      const o = JSON.parse(localStorage.getItem(KEY));
      return (o && Array.isArray(o.players) && o.players.length >= MIN_P) ? o : null;
    } catch(e){ return null; }
  }
  function loadHist(){
    try {
      const a = JSON.parse(localStorage.getItem(HKEY));
      return Array.isArray(a) ? a : [];
    } catch(e){ return []; }
  }
  function loadNames(){
    try {
      const a = JSON.parse(localStorage.getItem(NKEY));
      return Array.isArray(a) ? a.filter(n => typeof n === 'string') : [];
    } catch(e){ return []; }
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
  function saveHist(){ try{ localStorage.setItem(HKEY, JSON.stringify(H)); }catch(e){} }
  function saveNames(){ try{ localStorage.setItem(NKEY, JSON.stringify(N)); }catch(e){} }

  // --- namenlijst --------------------------------------------------------
  // "Speler 3" is een plaatshouder, geen naam — die onthouden we niet.
  const isPlaceholder = n => /^speler\s*\d*$/i.test(n.trim());
  const sameName = (a,b) => a.trim().toLowerCase() === b.trim().toLowerCase();

  function remember(names){
    names.map(n => n.trim()).filter(n => n && !isPlaceholder(n)).forEach(n => {
      N = N.filter(x => !sameName(x, n));
      N.unshift(n);
    });
    N = N.slice(0, MAX_N);
    saveNames();
  }
  // Vult een lege of nog naamloze plek; anders komt de speler erbij.
  function useName(n){
    if (S.players.some(p => sameName(p.name, n))) return;
    const slot = S.players.findIndex(p => !p.name.trim() || isPlaceholder(p.name));
    if (slot > -1) S.players[slot].name = n;
    else if (S.players.length < MAX_P) S.players.push({name:n, sc:{}});
    else return;
    save(); renderPlayers(); render();
  }

  // --- berekening --------------------------------------------------------
  const upperSum = p => UPPER.reduce((t,id) => t + (p.sc[id] ?? 0), 0);
  const hasBonus = p => upperSum(p) >= BONUS_AT;
  // Extra Yatzees tellen alleen mee als het Yatzee-vak zelf 50 scoorde.
  const ybOK     = p => p.sc.yz === 50;
  const lowerSum = p => CATS.filter(c => !UPPER.includes(c.id))
                            .reduce((t,c) => t + (c.id === 'yb' && !ybOK(p) ? 0 : (p.sc[c.id] ?? 0)), 0);
  const total    = p => upperSum(p) + (hasBonus(p) ? BONUS : 0) + lowerSum(p);
  const REQ      = CATS.filter(c => !c.opt);            // bonusrij is optioneel
  const filled   = p => REQ.filter(c => p.sc[c.id] != null).length;
  const done     = () => S.players.every(p => filled(p) === REQ.length);
  const started  = () => S.players.some(p => Object.keys(p.sc).length > 0);
  // Aantal Yatzees: het vak zelf plus elke bonus van 100.
  const yatzees  = p => ybOK(p) ? 1 + (p.sc.yb || 0) / 100 : 0;

  // --- rendering scorekaart ----------------------------------------------
  const $ = id => document.getElementById(id);
  const card = $('card');

  function render(){
    const tots = S.players.map(total);
    const max = Math.max(...tots);
    const anyDone = done();

    let h = '<thead><tr><th class="cat">Categorie</th>';
    S.players.forEach((p,i) => {
      const lead = (anyDone && tots[i] === max) ? ' plead' : '';
      h += `<th><span class="pname${lead}">${esc(p.name)}</span>
            <span class="ptot">${tots[i]}</span></th>`;
    });
    h += '</tr></thead><tbody>';

    const row = c => {
      let r = `<tr><td class="cat">${c.name}<small>${c.hint}</small></td>`;
      S.players.forEach((p,i) => {
        const v = p.sc[c.id];
        let cls = v == null ? 'empty' : (v === 0 ? 'zero' : '');
        if (c.id === 'yb') {
          // 0 extra Yatzees is geen doorgestreept vak, dus niet rood.
          // Wel doorstrepen als de bonus niet meetelt (Yatzee-vak niet 50).
          cls = v == null || v === 0 ? 'empty' : (ybOK(p) ? 'yb' : 'void');
        }
        const txt = v == null ? '–' : (c.id === 'yb' && v > 0 ? '+' + v : v);
        r += `<td class="score ${cls}" data-p="${i}" data-c="${c.id}">${txt}</td>`;
      });
      return r + '</tr>';
    };

    CATS.filter(c => UPPER.includes(c.id)).forEach(c => h += row(c));

    h += `<tr class="calc"><td class="cat">Subtotaal<small>bonus ${BONUS} bij ${BONUS_AT}+</small></td>`;
    S.players.forEach(p => h += `<td>${upperSum(p)}</td>`);
    h += '</tr><tr class="calc bonus"><td class="cat">Bonus</td>';
    S.players.forEach(p => {
      // Zolang het bovenvak niet vol is, tellen we af naar de bonusgrens.
      const upDone = UPPER.every(id => p.sc[id] != null);
      if (hasBonus(p))   h += `<td class="hit">+${BONUS}</td>`;
      else if (upDone)   h += '<td class="miss">gemist</td>';
      else               h += `<td class="need">nog ${BONUS_AT - upperSum(p)}</td>`;
    });
    h += '</tr><tr class="sep"><td colspan="' + (S.players.length+1) + '"></td></tr>';

    CATS.filter(c => !UPPER.includes(c.id)).forEach(c => h += row(c));

    h += '<tr class="calc total"><td class="cat">TOTAAL</td>';
    tots.forEach(t => h += `<td>${t}</td>`);
    h += '</tr></tbody>';

    card.innerHTML = h;
    $('banner').classList.toggle('hide', !anyDone);
  }

  const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

  // --- invoer sheet ------------------------------------------------------
  let cur = null;

  card.addEventListener('click', e => {
    const td = e.target.closest('td.score');
    if (!td) return;
    openSheet(+td.dataset.p, td.dataset.c);
  });

  function options(c){
    if (c.kind === 'face') return [0,1,2,3,4,5].map(n => n * c.face);
    if (c.kind === 'sum')  { const a=[0]; for(let n=5;n<=30;n++) a.push(n); return a; }
    if (c.kind === 'yb')   return [0,1,2,3,4,5,6].map(n => n * c.step);
    return [0, c.val];
  }

  function openSheet(pi, cid){
    const c = CATS.find(x => x.id === cid);
    const p = S.players[pi];
    cur = {pi, cid};
    $('shTitle').textContent = `${c.name} — ${p.name}`;
    // De Yatzee-bonus vervalt als het Yatzee-vak op 0 staat.
    $('shHint').textContent = (c.kind === 'yb' && p.sc.yz === 0)
      ? 'Vervalt: Yatzee staat op 0, dus geen bonus.'
      : c.hint;
    $('shOpts').innerHTML = options(c)
      .map(v => `<button class="opt${v===0?' zero':''}" data-v="${v}">${v}</button>`).join('');
    $('sheet').classList.add('on');
  }

  $('shOpts').addEventListener('click', e => {
    const b = e.target.closest('.opt');
    if (!b || !cur) return;
    S.players[cur.pi].sc[cur.cid] = +b.dataset.v;
    close(); save(); render();
  });
  $('shClear').onclick = () => {
    if (cur) delete S.players[cur.pi].sc[cur.cid];
    close(); save(); render();
  };
  $('shCancel').onclick = close;
  $('sheet').addEventListener('click', e => { if (e.target.id === 'sheet') close(); });
  function close(){ $('sheet').classList.remove('on'); cur = null; }

  // --- keuzesheet (in plaats van confirm) --------------------------------
  function ask(title, text, choices){
    $('cTitle').textContent = title;
    $('cText').textContent = text;
    const box = $('cBtns');
    box.innerHTML = '';
    choices.forEach((ch, i) => {
      const b = document.createElement('button');
      b.className = 'btn' + (ch.primary ? ' btn-acc' : '');
      b.textContent = ch.label;
      b.onclick = () => { $('csheet').classList.remove('on'); if (ch.fn) ch.fn(); };
      box.appendChild(b);
    });
    const cancel = document.createElement('button');
    cancel.className = 'btn';
    cancel.textContent = 'Annuleren';
    cancel.onclick = () => $('csheet').classList.remove('on');
    box.appendChild(cancel);
    $('csheet').classList.add('on');
  }
  $('csheet').addEventListener('click', e => {
    if (e.target.id === 'csheet') $('csheet').classList.remove('on');
  });

  // --- historie ----------------------------------------------------------
  function archive(){
    H.push({
      ts: new Date().toISOString(),
      players: S.players.map(p => ({
        name: p.name.trim() || 'Speler',
        sc: {...p.sc},
        total: total(p),
        bonus: hasBonus(p),
        yatzees: yatzees(p)
      }))
    });
    saveHist();
    remember(S.players.map(p => p.name));
  }
  function resetScores(){
    S.players.forEach(p => p.sc = {});
    save(); render();
  }
  $('btnFinish').onclick = () => {
    archive(); resetScores(); renderStats();
    ask('Opgeslagen', 'Het potje staat in je historie. De namen blijven staan voor het volgende potje.',
        [{label:'Naar statistieken', primary:true, fn:() => showView('vStats')}]);
  };
  $('btnNew').onclick = () => {
    if (!started()) return;
    ask('Nieuw potje', done()
        ? 'Dit potje is compleet. Opslaan in je historie?'
        : 'Dit potje is nog niet af. Toch afsluiten?', [
      {label:'Opslaan en opnieuw', primary:true, fn:() => { archive(); resetScores(); renderStats(); }},
      {label:'Wissen zonder opslaan', fn:resetScores}
    ]);
  };

  // --- statistieken ------------------------------------------------------
  function statsPerPlayer(){
    const by = new Map();
    // Chronologisch, zodat winreeksen kloppen.
    const games = H.slice().sort((a,b) => (a.ts < b.ts ? -1 : 1));
    games.forEach(g => {
      const best = Math.max(...g.players.map(p => p.total));
      g.players.forEach(p => {
        const k = p.name;
        if (!by.has(k)) by.set(k, {name:k, scores:[], wins:0, bonus:0, yatzees:0, streak:0, run:0});
        const s = by.get(k);
        s.scores.push(p.total);
        if (p.bonus) s.bonus++;
        s.yatzees += p.yatzees || 0;
        if (p.total === best) { s.wins++; s.run++; s.streak = Math.max(s.streak, s.run); }
        else s.run = 0;
      });
    });
    return [...by.values()].map(s => {
      const n = s.scores.length;
      return {...s, games:n,
        avg: Math.round(s.scores.reduce((a,b) => a+b, 0) / n),
        best: Math.max(...s.scores),
        worst: Math.min(...s.scores),
        winPct: Math.round(s.wins / n * 100),
        bonusPct: Math.round(s.bonus / n * 100),
        last: s.scores.slice(-10)
      };
    }).sort((a,b) => b.avg - a.avg);
  }

  // Sparkline: één reeks, dus geen legenda nodig — de kaart eromheen benoemt 'm.
  // Exacte cijfers staan in de historie eronder; dit toont alleen de vorm.
  function spark(vals, w = 116, h = 30){
    if (vals.length < 2) return '';
    const lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
    const step = w / (vals.length - 1);
    const pt = (v,i) => [i * step, h - 5 - ((v - lo) / span) * (h - 10)];
    const d = vals.map((v,i) => {
      const [x,y] = pt(v,i);
      return (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
    }).join(' ');
    const [lx,ly] = pt(vals[vals.length-1], vals.length-1);
    return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">
      <path d="${d}" fill="none" stroke="var(--acc)" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="4"
              fill="var(--acc)" stroke="var(--panel)" stroke-width="2"/>
    </svg>`;
  }

  const fmtDate = ts => {
    const d = new Date(ts);
    return isNaN(d) ? '' : d.toLocaleDateString('nl-NL', {day:'numeric', month:'short', year:'numeric'})
                          + ' · ' + d.toLocaleTimeString('nl-NL', {hour:'2-digit', minute:'2-digit'});
  };

  function renderStats(){
    const body = $('statsBody');
    if (!H.length){
      body.innerHTML = `<p class="empty-note">Nog geen potjes opgeslagen.<br>
        Speel een potje uit en tik op <b>Opslaan</b> — daarna verschijnen hier
        gemiddelden, records en je volledige historie.</p>`;
      return;
    }

    const ps = statsPerPlayer();
    let h = '<section><h2>Ranglijst — op gemiddelde</h2><div class="stack">';
    ps.forEach(s => {
      const sp = spark(s.last);
      h += `<div class="pcard">
        <div class="pc-top"><span class="pc-name">${esc(s.name)}</span>
          <span class="pc-avg">${s.avg}<small>gem.</small></span></div>
        <div class="pc-sub">${s.games} ${s.games === 1 ? 'potje' : 'potjes'} ·
          ${s.wins}× gewonnen (${s.winPct}%) · beste ${s.best} · laagste ${s.worst} ·
          bonus ${s.bonusPct}%</div>
        ${sp ? `<div class="pc-spark">${sp}
          <span class="pc-last">laatste ${s.last.length}: nu ${s.last[s.last.length-1]}</span></div>` : ''}
      </div>`;
    });
    h += '</div></section>';

    // Records
    const flat = H.flatMap(g => g.players.map(p => ({...p, ts:g.ts})));
    const top = flat.reduce((a,b) => b.total > a.total ? b : a);
    const yTop = flat.reduce((a,b) => (b.yatzees||0) > (a.yatzees||0) ? b : a);
    const strk = ps.reduce((a,b) => b.streak > a.streak ? b : a);
    h += `<section><h2>Records</h2>
      <div class="rec"><b>${top.total}</b><span class="rec-lb">Hoogste potje
        <small>${esc(top.name)} · ${fmtDate(top.ts)}</small></span></div>
      <div class="rec"><b>${yTop.yatzees || 0}</b><span class="rec-lb">Meeste Yatzees in één potje
        <small>${(yTop.yatzees ? esc(yTop.name) + ' · ' + fmtDate(yTop.ts) : 'nog geen Yatzee gegooid')}</small></span></div>
      <div class="rec"><b>${strk.streak}</b><span class="rec-lb">Langste reeks gewonnen potjes
        <small>${esc(strk.name)}</small></span></div>
    </section>`;

    // Historie, nieuwste eerst
    const games = H.slice().sort((a,b) => (a.ts < b.ts ? 1 : -1));
    h += `<section><h2>Historie — ${H.length} ${H.length === 1 ? 'potje' : 'potjes'}</h2>`;
    games.forEach(g => {
      const best = Math.max(...g.players.map(p => p.total));
      const line = g.players.map(p =>
        `<span class="${p.total === best ? 'h-win' : ''}">${esc(p.name)} ${p.total}</span>`
      ).join(' · ');
      h += `<div class="hrow">
        <div class="h-main"><div class="h-date">${fmtDate(g.ts)}</div>
          <div class="h-players">${line}</div></div>
        <button class="h-del" data-ts="${esc(g.ts)}" aria-label="Potje verwijderen">✕</button>
      </div>`;
    });
    h += '</section>';

    body.innerHTML = h;
  }

  $('statsBody').addEventListener('click', e => {
    const d = e.target.closest('.h-del');
    if (!d) return;
    ask('Potje verwijderen', 'Dit potje wordt uit je historie en statistieken gehaald.', [
      {label:'Verwijderen', fn:() => {
        H = H.filter(g => g.ts !== d.dataset.ts);
        saveHist(); renderStats();
      }}
    ]);
  });

  // --- views -------------------------------------------------------------
  function showView(id){
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === id));
    document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.view === id));
    const stats = id === 'vStats';
    $('btnPlayers').classList.toggle('hide', stats);
    $('btnNew').classList.toggle('hide', stats);
    $('btnBackup').classList.toggle('hide', !stats);
    if (stats) renderStats();
  }
  document.querySelector('nav.tabs').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (b) showView(b.dataset.view);
  });

  // --- back-up -----------------------------------------------------------
  $('btnBackup').onclick = () => {
    $('bkText').value = JSON.stringify({app:'yatzee', v:1, history:H});
    $('bkMsg').textContent = `${H.length} ${H.length === 1 ? 'potje' : 'potjes'} in deze back-up.`;
    $('bsheet').classList.add('on');
  };
  $('bkCopy').onclick = async () => {
    const t = $('bkText');
    t.select();
    try {
      await navigator.clipboard.writeText(t.value);
      $('bkMsg').textContent = 'Gekopieerd naar je klembord.';
    } catch(e){
      $('bkMsg').textContent = 'Kopiëren lukte niet — houd de tekst ingedrukt en kies Kopieer.';
    }
  };
  $('bkImport').onclick = () => {
    let inc;
    try { inc = JSON.parse($('bkText').value); }
    catch(e){ $('bkMsg').textContent = 'Dit is geen geldige back-up.'; return; }
    const list = Array.isArray(inc) ? inc : (inc && inc.history);
    if (!Array.isArray(list)){ $('bkMsg').textContent = 'Geen potjes gevonden in deze tekst.'; return; }
    const seen = new Set(H.map(g => g.ts));
    const add = list.filter(g => g && g.ts && Array.isArray(g.players) && !seen.has(g.ts));
    H = H.concat(add);
    saveHist(); renderStats();
    $('bkMsg').textContent = add.length
      ? `${add.length} ${add.length === 1 ? 'potje' : 'potjes'} toegevoegd.`
      : 'Alles zat er al in — niets toegevoegd.';
  };
  $('bkClose').onclick = () => $('bsheet').classList.remove('on');
  $('bsheet').addEventListener('click', e => {
    if (e.target.id === 'bsheet') $('bsheet').classList.remove('on');
  });

  // --- spelers -----------------------------------------------------------
  function renderPlayers(){
    $('plist').innerHTML = S.players.map((p,i) => `
      <div class="prow">
        <input type="text" value="${esc(p.name)}" data-i="${i}" maxlength="14" placeholder="Naam">
        ${S.players.length > MIN_P ? `<button class="del" data-del="${i}">✕</button>` : ''}
      </div>`).join('');
    $('pAdd').style.display = S.players.length >= MAX_P ? 'none' : '';
    renderChips();
  }

  let rosterEdit = false;
  function renderChips(){
    const free = N.filter(n => !S.players.some(p => sameName(p.name, n)));
    $('roster').classList.toggle('hide', !N.length);
    $('rosterTitle').textContent = rosterEdit ? 'Tik om te verwijderen' : 'Eerder gespeeld';
    $('rosterEdit').textContent = rosterEdit ? 'Klaar' : 'Bewerken';
    $('chips').classList.toggle('editing', rosterEdit);
    const list = rosterEdit ? N : free;
    $('chips').innerHTML = list.length
      ? list.map(n => `<button class="chip" data-name="${esc(n)}">${esc(n)}</button>`).join('')
      : '<span class="empty-note">Iedereen doet al mee.</span>';
  }
  $('rosterEdit').onclick = () => { rosterEdit = !rosterEdit; renderChips(); };
  $('chips').addEventListener('click', e => {
    const c = e.target.closest('.chip');
    if (!c) return;
    const n = c.dataset.name;
    if (rosterEdit){ N = N.filter(x => !sameName(x, n)); saveNames(); renderChips(); }
    else useName(n);
  });
  $('plist').addEventListener('input', e => {
    if (e.target.tagName === 'INPUT') {
      S.players[+e.target.dataset.i].name = e.target.value || 'Speler';
      save();
    }
  });
  $('plist').addEventListener('click', e => {
    const d = e.target.closest('[data-del]');
    if (!d) return;
    const i = +d.dataset.del;
    ask('Speler verwijderen', `${S.players[i].name} uit dit potje halen? Eerder opgeslagen potjes blijven staan.`, [
      {label:'Verwijderen', fn:() => { S.players.splice(i,1); save(); renderPlayers(); render(); }}
    ]);
  });
  $('pAdd').onclick = () => {
    if (S.players.length >= MAX_P) return;
    S.players.push({name:`Speler ${S.players.length+1}`, sc:{}});
    save(); renderPlayers(); render();
  };
  $('pDone').onclick = () => {
    remember(S.players.map(p => p.name));
    rosterEdit = false;
    $('psheet').classList.remove('on');
    render();
  };
  $('btnPlayers').onclick = () => { renderPlayers(); $('psheet').classList.add('on'); };
  $('psheet').addEventListener('click', e => {
    if (e.target.id === 'psheet') $('psheet').classList.remove('on');
  });

  // --- thema: systeem → licht → donker -----------------------------------
  const THEMES = ['auto','light','dark'];
  const ICON  = {auto:'◐', light:'☀', dark:'☾'};
  const LABEL = {auto:'Thema: volgt systeem', light:'Thema: licht', dark:'Thema: donker'};
  const TCOL  = {light:'#f7f4ee', dark:'#0d1117'};
  const sysDark = matchMedia('(prefers-color-scheme: dark)');
  let theme = 'auto';
  try { theme = localStorage.getItem('yatzee.theme') || 'auto'; } catch(e){}
  if (!THEMES.includes(theme)) theme = 'auto';

  function applyTheme(){
    if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.dataset.theme = theme;
    // Statusbalk meekleuren met wat er daadwerkelijk getoond wordt.
    const shown = theme === 'auto' ? (sysDark.matches ? 'dark' : 'light') : theme;
    const tc = $('tcolor'); if (tc) tc.setAttribute('content', TCOL[shown]);
    const b = $('btnTheme');
    b.textContent = ICON[theme];
    b.setAttribute('aria-label', LABEL[theme]);
    b.setAttribute('title', LABEL[theme]);
  }
  $('btnTheme').onclick = () => {
    theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
    try { localStorage.setItem('yatzee.theme', theme); } catch(e){}
    applyTheme();
  };
  sysDark.addEventListener('change', applyTheme);

  applyTheme();
  render();
})();
</script>
</body>
</html>
