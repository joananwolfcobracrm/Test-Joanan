<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yatzee">
<meta name="theme-color" content="#0d1117">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230d1117'/%3E%3Cg fill='%23f5c518'%3E%3Ccircle cx='60' cy='60' r='14'/%3E%3Ccircle cx='120' cy='60' r='14'/%3E%3Ccircle cx='90' cy='90' r='14'/%3E%3Ccircle cx='60' cy='120' r='14'/%3E%3Ccircle cx='120' cy='120' r='14'/%3E%3C/g%3E%3C/svg%3E">
<title>Yatzee Scores</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#2a323d; --line-soft:#212934;
    --txt:#e6edf3; --dim:#8b949e; --acc:#f5c518; --good:#3fb950; --bad:#f85149;
    --cell:56px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg); color:var(--txt);
    font:16px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    padding-top:env(safe-area-inset-top);
    -webkit-user-select:none; user-select:none;
    overscroll-behavior:none;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  header{
    display:flex; align-items:center; gap:10px;
    padding:10px 14px; border-bottom:1px solid var(--line);
    background:var(--panel); position:sticky; top:0; z-index:5;
  }
  header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.3px;flex:1}
  header h1 span{color:var(--acc)}
  .btn{
    padding:8px 12px; border-radius:9px; background:#21262d;
    border:1px solid var(--line); font-size:14px; font-weight:600;
  }
  .btn:active{background:#2d333b}
  .btn-acc{background:var(--acc); color:#111; border-color:var(--acc)}

  /* ---------- scorecard ---------- */
  .wrap{overflow:auto; -webkit-overflow-scrolling:touch; padding-bottom:40px}
  table{border-collapse:separate; border-spacing:0; width:max-content; min-width:100%}
  th,td{border-bottom:1px solid var(--line-soft); text-align:center; height:var(--cell)}
  thead th{
    position:sticky; top:0; z-index:3; background:var(--panel);
    border-bottom:1px solid var(--line); font-size:13px; padding:6px 4px;
  }
  .cat{
    position:sticky; left:0; z-index:2; background:var(--bg);
    text-align:left; padding:0 10px; min-width:150px; font-size:14px;
    border-right:1px solid var(--line);
  }
  thead .cat{z-index:4; background:var(--panel)}
  .cat small{display:block; color:var(--dim); font-size:11px; font-weight:400}
  td.score{min-width:72px; font-size:19px; font-weight:600; font-variant-numeric:tabular-nums}
  td.score.empty{color:#3d444d}
  td.score.zero{color:var(--bad)}
  td.score:active{background:#1c2430}
  tr.calc td, tr.calc .cat{background:#131a22; font-weight:700}
  tr.calc td{color:var(--dim); font-size:16px}
  tr.bonus td.hit{color:var(--good)}
  tr.total td{color:var(--acc); font-size:22px}
  tr.total .cat{font-size:15px}
  tr.sep td, tr.sep th{height:8px; border:0; background:#0a0e14}
  .pname{display:block; font-weight:700; max-width:90px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin:0 auto}
  .plead{color:var(--acc)}
  .ptot{display:block; color:var(--dim); font-size:12px; font-weight:600}

  /* ---------- sheet ---------- */
  .sheet{
    position:fixed; inset:0; z-index:20; display:none;
    background:rgba(0,0,0,.6); backdrop-filter:blur(2px);
  }
  .sheet.on{display:block}
  .sheet-in{
    position:absolute; left:0; right:0; bottom:0; background:var(--panel);
    border-top:1px solid var(--line); border-radius:18px 18px 0 0;
    padding:14px 14px calc(18px + env(safe-area-inset-bottom));
    animation:up .18s ease-out;
  }
  @keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .sheet h2{margin:0 0 2px; font-size:18px}
  .sheet p{margin:0 0 12px; color:var(--dim); font-size:13px}
  .opts{display:grid; grid-template-columns:repeat(auto-fill,minmax(72px,1fr)); gap:8px}
  .opt{
    padding:14px 4px; border-radius:12px; background:#21262d; border:1px solid var(--line);
    font-size:19px; font-weight:700; font-variant-numeric:tabular-nums;
  }
  .opt:active{background:var(--acc); color:#111}
  .opt.zero{color:var(--bad)}
  .sheet-foot{display:flex; gap:8px; margin-top:14px}
  .sheet-foot .btn{flex:1; text-align:center; padding:13px}

  /* ---------- setup ---------- */
  .setup{padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
  .setup h2{font-size:16px; margin:0 0 12px}
  .prow{display:flex; gap:8px; align-items:center; margin-bottom:8px}
  .prow input{
    flex:1; padding:13px 12px; border-radius:11px; background:#0b1017;
    border:1px solid var(--line); color:var(--txt); font-size:16px;
    -webkit-user-select:text; user-select:text;
  }
  .prow input:focus{outline:none; border-color:var(--acc)}
  .prow .del{padding:12px 14px; color:var(--bad); font-size:20px; line-height:1}
  .setup .btn{width:100%; text-align:center; padding:14px; margin-top:8px}
</style>
</head>
<body>

<header>
  <h1>YATZEE<span>·</span>scores</h1>
  <button class="btn" id="btnPlayers">Spelers</button>
  <button class="btn" id="btnNew">Nieuw</button>
</header>

<div class="wrap"><table id="card"></table></div>

<div class="sheet" id="sheet">
  <div class="sheet-in">
    <h2 id="shTitle"></h2>
    <p id="shHint"></p>
    <div class="opts" id="shOpts"></div>
    <div class="sheet-foot">
      <button class="btn" id="shClear">Wissen</button>
      <button class="btn" id="shCancel">Annuleren</button>
    </div>
  </div>
</div>

<div class="sheet" id="psheet">
  <div class="sheet-in">
    <h2>Spelers</h2>
    <p>Namen aanpassen, toevoegen of verwijderen (max 8).</p>
    <div class="setup" style="padding:0">
      <div id="plist"></div>
      <button class="btn" id="pAdd">+ Speler toevoegen</button>
      <button class="btn btn-acc" id="pDone">Klaar</button>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  // --- categorieën -------------------------------------------------------
  // kind: 'face'  = bovenvak (aantal ogen x waarde)
  //       'sum'   = som van alle 5 dobbelstenen (5..30)
  //       'fixed' = vaste score of 0
  //       'straat'= vaste score of 0
  const CATS = [
    {id:'d1', name:'Enen',          hint:'1 punt per één',   kind:'face', face:1},
    {id:'d2', name:'Tweeën',        hint:'2 punten per twee',kind:'face', face:2},
    {id:'d3', name:'Drieën',        hint:'3 punten per drie',kind:'face', face:3},
    {id:'d4', name:'Vieren',        hint:'4 punten per vier',kind:'face', face:4},
    {id:'d5', name:'Vijven',        hint:'5 punten per vijf',kind:'face', face:5},
    {id:'d6', name:'Zessen',        hint:'6 punten per zes', kind:'face', face:6},
    {id:'tk', name:'Drie gelijk',   hint:'Som van alle 5 stenen', kind:'sum'},
    {id:'fk', name:'Vier gelijk',   hint:'Som van alle 5 stenen', kind:'sum'},
    {id:'fh', name:'Full house',    hint:'3 + 2 gelijk',     kind:'fixed', val:25},
    {id:'ss', name:'Kleine straat', hint:'4 op een rij',     kind:'fixed', val:30},
    {id:'ls', name:'Grote straat',  hint:'5 op een rij',     kind:'fixed', val:40},
    {id:'yz', name:'Yatzee',        hint:'5 gelijk',         kind:'fixed', val:50},
    {id:'ch', name:'Chance',        hint:'Som van alle 5 stenen', kind:'sum'}
  ];
  const UPPER = ['d1','d2','d3','d4','d5','d6'];
  const BONUS_AT = 63, BONUS = 35;
  const KEY = 'yatzee.v1';

  // --- state -------------------------------------------------------------
  let S = load() || newGame(['Speler 1','Speler 2']);

  function newGame(names){ return {players: names.map(n => ({name:n, sc:{}}))}; }
  function load(){
    try {
      const o = JSON.parse(localStorage.getItem(KEY));
      return (o && Array.isArray(o.players) && o.players.length) ? o : null;
    } catch(e){ return null; }
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

  // --- berekening --------------------------------------------------------
  const upperSum = p => UPPER.reduce((t,id) => t + (p.sc[id] ?? 0), 0);
  const hasBonus = p => upperSum(p) >= BONUS_AT;
  const lowerSum = p => CATS.filter(c => !UPPER.includes(c.id))
                            .reduce((t,c) => t + (p.sc[c.id] ?? 0), 0);
  const total    = p => upperSum(p) + (hasBonus(p) ? BONUS : 0) + lowerSum(p);
  const filled   = p => CATS.filter(c => p.sc[c.id] != null).length;
  const done     = () => S.players.every(p => filled(p) === CATS.length);

  // --- rendering ---------------------------------------------------------
  const $ = id => document.getElementById(id);
  const card = $('card');

  function render(){
    const tots = S.players.map(total);
    const max = Math.max(...tots);
    const anyDone = done();

    let h = '<thead><tr><th class="cat">Categorie</th>';
    S.players.forEach((p,i) => {
      const lead = (anyDone && tots[i] === max) ? ' plead' : '';
      h += `<th><span class="pname${lead}">${esc(p.name)}</span>
            <span class="ptot">${tots[i]}</span></th>`;
    });
    h += '</tr></thead><tbody>';

    const row = c => {
      let r = `<tr><td class="cat">${c.name}<small>${c.hint}</small></td>`;
      S.players.forEach((p,i) => {
        const v = p.sc[c.id];
        const cls = v == null ? 'empty' : (v === 0 ? 'zero' : '');
        r += `<td class="score ${cls}" data-p="${i}" data-c="${c.id}">${v == null ? '–' : v}</td>`;
      });
      return r + '</tr>';
    };

    CATS.filter(c => UPPER.includes(c.id)).forEach(c => h += row(c));

    h += `<tr class="calc"><td class="cat">Subtotaal<small>bonus ${BONUS} bij ${BONUS_AT}+</small></td>`;
    S.players.forEach(p => h += `<td>${upperSum(p)}</td>`);
    h += '</tr><tr class="calc bonus"><td class="cat">Bonus</td>';
    S.players.forEach(p => {
      const b = hasBonus(p);
      h += `<td class="${b?'hit':''}">${b ? '+'+BONUS : '–'}</td>`;
    });
    h += '</tr><tr class="sep"><td colspan="' + (S.players.length+1) + '"></td></tr>';

    CATS.filter(c => !UPPER.includes(c.id)).forEach(c => h += row(c));

    h += '<tr class="calc total"><td class="cat">TOTAAL</td>';
    tots.forEach(t => h += `<td>${t}</td>`);
    h += '</tr></tbody>';

    card.innerHTML = h;
  }

  const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

  // --- invoer sheet ------------------------------------------------------
  let cur = null;

  card.addEventListener('click', e => {
    const td = e.target.closest('td.score');
    if (!td) return;
    openSheet(+td.dataset.p, td.dataset.c);
  });

  function options(c){
    if (c.kind === 'face') return [0,1,2,3,4,5].map(n => n * c.face);
    if (c.kind === 'sum')  { const a=[0]; for(let n=5;n<=30;n++) a.push(n); return a; }
    return [0, c.val];
  }

  function openSheet(pi, cid){
    const c = CATS.find(x => x.id === cid);
    cur = {pi, cid};
    $('shTitle').textContent = `${c.name} — ${S.players[pi].name}`;
    $('shHint').textContent = c.hint;
    $('shOpts').innerHTML = options(c)
      .map(v => `<button class="opt${v===0?' zero':''}" data-v="${v}">${v}</button>`).join('');
    $('sheet').classList.add('on');
  }

  $('shOpts').addEventListener('click', e => {
    const b = e.target.closest('.opt');
    if (!b || !cur) return;
    S.players[cur.pi].sc[cur.cid] = +b.dataset.v;
    close(); save(); render();
  });
  $('shClear').onclick = () => {
    if (cur) delete S.players[cur.pi].sc[cur.cid];
    close(); save(); render();
  };
  $('shCancel').onclick = close;
  $('sheet').addEventListener('click', e => { if (e.target.id === 'sheet') close(); });
  function close(){ $('sheet').classList.remove('on'); cur = null; }

  // --- spelers -----------------------------------------------------------
  function renderPlayers(){
    $('plist').innerHTML = S.players.map((p,i) => `
      <div class="prow">
        <input type="text" value="${esc(p.name)}" data-i="${i}" maxlength="14" placeholder="Naam">
        ${S.players.length > 1 ? `<button class="del" data-del="${i}">✕</button>` : ''}
      </div>`).join('');
  }
  $('plist').addEventListener('input', e => {
    if (e.target.tagName === 'INPUT') {
      S.players[+e.target.dataset.i].name = e.target.value || 'Speler';
      save();
    }
  });
  $('plist').addEventListener('click', e => {
    const d = e.target.closest('[data-del]');
    if (!d) return;
    if (confirm(`${S.players[+d.dataset.del].name} verwijderen?`)) {
      S.players.splice(+d.dataset.del, 1);
      save(); renderPlayers(); render();
    }
  });
  $('pAdd').onclick = () => {
    if (S.players.length >= 8) return;
    S.players.push({name:`Speler ${S.players.length+1}`, sc:{}});
    save(); renderPlayers(); render();
  };
  $('pDone').onclick = () => $('psheet').classList.remove('on');
  $('btnPlayers').onclick = () => { renderPlayers(); $('psheet').classList.add('on'); };
  $('psheet').addEventListener('click', e => {
    if (e.target.id === 'psheet') $('psheet').classList.remove('on');
  });

  $('btnNew').onclick = () => {
    if (!confirm('Nieuw potje starten? Scores worden gewist, namen blijven.')) return;
    S.players.forEach(p => p.sc = {});
    save(); render();
  };

  render();
})();
</script>
</body>
</html>
