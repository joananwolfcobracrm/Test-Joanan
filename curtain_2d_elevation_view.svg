<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -30 1440 1810" width="280" height="350">
  <!-- 2D Elevation View (front) of Curtain -->
  <!-- 1400mm wide x 1750mm high, units in mm -->

  <!-- Curtain rod -->
  <rect x="-20" y="-20" width="1440" height="10" rx="5" ry="5" fill="#777" stroke="#555" stroke-width="1"/>
  <!-- Rod finials -->
  <circle cx="-20" cy="-15" r="10" fill="#888" stroke="#555" stroke-width="1"/>
  <circle cx="1420" cy="-15" r="10" fill="#888" stroke="#555" stroke-width="1"/>

  <!-- Curtain rings -->
  <circle cx="50" cy="-15" r="8" fill="none" stroke="#666" stroke-width="2"/>
  <circle cx="170" cy="-15" r="8" fill="none" stroke="#666" stroke-width="2"/>
  <circle cx="290" cy="-15" r="8" fill="none" stroke="#666" stroke-width="2"/>
  <circle cx="410" cy="-15" r="8" fill="none" stroke="#666" stroke-width="2"/>
  <circle cx="560" cy="-15" r="8" fill="none" stroke="#666" stroke-width="2"/>
  <circle cx="840" cy="-15" r="8" fill="none" stroke="#666" stroke-width="2"/>
  <circle cx="990" cy="-15" r="8" fill="none" stroke="#666" stroke-width="2"/>
  <circle cx="1110" cy="-15" r="8" fill="none" stroke="#666" stroke-width="2"/>
  <circle cx="1230" cy="-15" r="8" fill="none" stroke="#666" stroke-width="2"/>
  <circle cx="1350" cy="-15" r="8" fill="none" stroke="#666" stroke-width="2"/>

  <!-- Left curtain panel -->
  <path d="M0,0
    C10,0 10,1740 5,1750
    L680,1750
    C675,1740 675,0 680,0 Z"
    fill="#c0c0c0" stroke="#999" stroke-width="1"/>

  <!-- Left panel fold lines -->
  <path d="M100,0 C95,400 105,900 98,1750" fill="none" stroke="#a8a8a8" stroke-width="2"/>
  <path d="M200,0 C205,350 195,850 202,1750" fill="none" stroke="#b0b0b0" stroke-width="1.5"/>
  <path d="M300,0 C295,400 305,900 298,1750" fill="none" stroke="#a8a8a8" stroke-width="2"/>
  <path d="M400,0 C405,350 395,850 402,1750" fill="none" stroke="#b0b0b0" stroke-width="1.5"/>
  <path d="M500,0 C495,400 505,900 498,1750" fill="none" stroke="#a8a8a8" stroke-width="2"/>
  <path d="M600,0 C605,350 595,850 602,1750" fill="none" stroke="#b0b0b0" stroke-width="1.5"/>

  <!-- Right curtain panel -->
  <path d="M720,0
    C730,0 730,1740 725,1750
    L1400,1750
    C1395,1740 1395,0 1400,0 Z"
    fill="#c0c0c0" stroke="#999" stroke-width="1"/>

  <!-- Right panel fold lines -->
  <path d="M820,0 C815,400 825,900 818,1750" fill="none" stroke="#a8a8a8" stroke-width="2"/>
  <path d="M920,0 C925,350 915,850 922,1750" fill="none" stroke="#b0b0b0" stroke-width="1.5"/>
  <path d="M1020,0 C1015,400 1025,900 1018,1750" fill="none" stroke="#a8a8a8" stroke-width="2"/>
  <path d="M1120,0 C1125,350 1115,850 1122,1750" fill="none" stroke="#b0b0b0" stroke-width="1.5"/>
  <path d="M1220,0 C1215,400 1225,900 1218,1750" fill="none" stroke="#a8a8a8" stroke-width="2"/>
  <path d="M1320,0 C1325,350 1315,850 1322,1750" fill="none" stroke="#b0b0b0" stroke-width="1.5"/>
</svg>
